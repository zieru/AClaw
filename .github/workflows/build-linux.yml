name: Build Linux Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (amd64 & arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Static Linux Binaries
        run: |
          mkdir -p dist
          # Linux AMD64 (x86_64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/goassistant-linux-amd64 ./cmd/goassistant
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/goassistant-linux-arm64 ./cmd/goassistant

      - name: Upload Linux Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goassistant-linux-binaries
          path: dist/goassistant-linux-*
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/goassistant-linux-amd64
            dist/goassistant-linux-arm64
          generate_release_notes: true

