name: Build & Release Linux x64 Binary

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (x86_64 / amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Static Linux x64 Binary (Zero-CGO)
        run: |
          mkdir -p dist
          # Linux AMD64 (x86_64 Pure Go Static Binary)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/goassistant-linux-amd64 ./cmd/goassistant

      - name: Upload Linux Binary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goassistant-linux-amd64
          path: dist/goassistant-linux-amd64
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/goassistant-linux-amd64
          generate_release_notes: true


