# ==============================================================================
# GoAssist HTTP - Dynamic API Endpoints Configuration
# ==============================================================================
# File ini mendefinisikan rute HTTP API yang dieksekusi ke binary CLI (g3a / lainnya).
# Format tipe endpoint:
#   - pagination : Mendukung pagination (page/offset & limit) + query filter/sort/select dll.
#   - regular    : API biasa tanpa kalkulasi pagination.
# ==============================================================================

endpoints:
  # ----------------------------------------------------------------------------
  # Contoh 1: Funneling API (Tipe Pagination)
  # Endpoint ini otomatis mengubah query param:
  # ?page=2&limit=15&select=id,name&filter=status:active&sort=desc&output=json
  # Menjadi argumen CLI:
  # g3a /datafunneling/funneling --filter=status:active --limit=15 --output=json --page=2 --select=id,name --sort=desc
  # ----------------------------------------------------------------------------
  - path: "/api/datafunneling/funneling"
    method: "GET"
    binary: "g3a"
    command: "/datafunneling/funneling"
    type: "pagination"
    timeout_seconds: 30
    defaults:
      output: "json"
    pagination:
      default_page: 1
      default_limit: 10
      max_limit: 100
      pass_as: "page" # "page" menghasilkan --page=X --limit=Y, atau "offset" menghasilkan --offset=X --limit=Y

  # ----------------------------------------------------------------------------
  # Contoh 2: Summary API (Tipe Regular Non-Pagination)
  # ----------------------------------------------------------------------------
  - path: "/api/datafunneling/summary"
    method: "GET"
    binary: "g3a"
    command: "/datafunneling/summary"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"

  # ============================================================================
  # ============================================================================
  # Modular Visit Analytics API Endpoints (Dihitung langsung via DuckDB Engine g3a)
  # ============================================================================

  # ----------------------------------------------------------------------------
  # 1. Visit KPI Ringkasan Kartu
  # ----------------------------------------------------------------------------
  - path: "/api/visit/kpi"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'count(1) as total_visits, count(1) filter (where flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'') as served_count, count(1) filter (where flag_dilayani = 0 or flag_dilayani = ''0'' or lower(cast(flag_dilayani as varchar)) like ''%batal%'' or lower(cast(flag_dilayani as varchar)) like ''%tidak%'') as unserved_count, printf(''%.1f%%'', 100.0 * count(1) filter (where flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'') / nullif(count(1), 0)) as served_ratio, count(1) filter (where hvc_tsel = 1 or hvc_tsel = ''1'') as total_momo, count(1) filter (where hvc_indihome = 1 or hvc_indihome = ''1'') as total_tomo'

  # ----------------------------------------------------------------------------
  # 2. Visit Tren Harian (Trx Date)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/trend"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'strftime(cast("Trx Date" as date), ''%Y-%m-%d'') as "Trx Date", count(1) as total'
      group-by: 'strftime(cast("Trx Date" as date), ''%Y-%m-%d'')'
      order-by: 'strftime(cast("Trx Date" as date), ''%Y-%m-%d'') asc'

  # ----------------------------------------------------------------------------
  # 3. Proporsi Layanan (Service)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/service"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: '"Service", count(1) as total'
      group-by: '"Service"'
      order-by: 'total desc'

  # ----------------------------------------------------------------------------
  # 4. Kunjungan per Regional
  # ----------------------------------------------------------------------------
  - path: "/api/visit/regional"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'regional, count(1) as total'
      group-by: 'regional'
      order-by: 'total desc'

  # ----------------------------------------------------------------------------
  # 5. Kunjungan per GraPARI (Untuk Top 10 & Bottom 10)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/grapari"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: '"Nama Grapari", regional, count(1) as total'
      group-by: '"Nama Grapari", regional'
      order-by: 'total desc'

  # ----------------------------------------------------------------------------
  # 6. MoM (Month-over-Month) Aggregation & Comparison
  # ----------------------------------------------------------------------------
  - path: "/api/visit/mom"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'strftime(cast("Trx Date" as date), ''%Y-%m'') as periode, count(1) as total_visits, count(1) filter (where flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'') as served_count, count(1) filter (where flag_dilayani = 0 or flag_dilayani = ''0'' or lower(cast(flag_dilayani as varchar)) like ''%batal%'' or lower(cast(flag_dilayani as varchar)) like ''%tidak%'') as unserved_count, printf(''%.1f%%'', 100.0 * count(1) filter (where flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'') / nullif(count(1), 0)) as served_ratio'
      group-by: 'strftime(cast("Trx Date" as date), ''%Y-%m'')'
      order-by: 'strftime(cast("Trx Date" as date), ''%Y-%m'') asc'
      limit: '24'










