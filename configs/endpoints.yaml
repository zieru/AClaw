# ==============================================================================
# GoAssist HTTP - Dynamic API Endpoints Configuration
# ==============================================================================
# File ini mendefinisikan rute HTTP API yang dieksekusi ke binary CLI (g3a / lainnya).
# Format tipe endpoint:
#   - pagination : Mendukung pagination (page/offset & limit) + query filter/sort/select dll.
#   - regular    : API biasa tanpa kalkulasi pagination.
# ==============================================================================

endpoints:
  # ----------------------------------------------------------------------------
  # Contoh 1: Funneling API (Tipe Pagination)
  # Endpoint ini otomatis mengubah query param:
  # ?page=2&limit=15&select=id,name&filter=status:active&sort=desc&output=json
  # Menjadi argumen CLI:
  # g3a /datafunneling/funneling --filter=status:active --limit=15 --output=json --page=2 --select=id,name --sort=desc
  # ----------------------------------------------------------------------------
  - path: "/api/datafunneling/funneling"
    method: "GET"
    binary: "g3a"
    command: "/datafunneling/funneling"
    type: "pagination"
    timeout_seconds: 30
    defaults:
      output: "json"
    pagination:
      default_page: 1
      default_limit: 10
      max_limit: 100
      pass_as: "page" # "page" menghasilkan --page=X --limit=Y, atau "offset" menghasilkan --offset=X --limit=Y

  # ----------------------------------------------------------------------------
  # Contoh 2: Summary API (Tipe Regular Non-Pagination)
  # ----------------------------------------------------------------------------
  - path: "/api/datafunneling/summary"
    method: "GET"
    binary: "g3a"
    command: "/datafunneling/summary"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"

  # ============================================================================
  # Status Order Fallout Analytics Endpoints (Engine g3a)
  # ============================================================================

  # ----------------------------------------------------------------------------
  # 1. Total KPI Fallout (Periode Jun - Agu)
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/kpi"
    method: "GET"
    binary: "g3a"
    command: "funneling"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: "count(1) filter (where mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)) as total_fallout, count(1) filter (where periode in (6,7,8)) as total_order, printf('%.2f%%', 100.0 * count(1) filter (where mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)) / nullif(count(1) filter (where periode in (6,7,8)), 0)) as fallout_rate"
      where: "periode in (6,7,8)"

  # ----------------------------------------------------------------------------
  # 2. Rekap Fallout per Regional & Periode Bulan (Bar Chart Data)
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/regional"
    method: "GET"
    binary: "g3a"
    command: "funneling"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: "region, count(1) filter (where mapping_kategori in ('PENDING','FALLOUT') and periode=6) as juni, count(1) filter (where mapping_kategori in ('PENDING','FALLOUT') and periode=7) as juli, count(1) filter (where mapping_kategori in ('PENDING','FALLOUT') and periode=8) as agustus, count(1) filter (where mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)) as total"
      where: "periode in (6,7,8)"
      group-by: "region"
      order-by: "total desc"

  # ----------------------------------------------------------------------------
  # 3. Top Fallout Reasons / Root Causes
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/reasons"
    method: "GET"
    binary: "g3a"
    command: "funneling"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: "coalesce(fallout_reason, order_status_desc, 'Unknown') as reason, count(1) as total"
      where: "mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)"
      group-by: "coalesce(fallout_reason, order_status_desc, 'Unknown')"
      order-by: "total desc"
      limit: "10"

  # ----------------------------------------------------------------------------
  # 4. Fallout Resolver (Need Support Alignment)
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/resolver"
    method: "GET"
    binary: "g3a"
    command: "funneling"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: "coalesce(mapping_resolver, 'Need Alignment') as resolver, count(1) as total"
      where: "mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)"
      group-by: "coalesce(mapping_resolver, 'Need Alignment')"
      order-by: "total desc"
      limit: "10"

  # ----------------------------------------------------------------------------
  # 5. AI Business Insights: Paint Points & Need Support (Built-in Global LLM)
  # Endpoint: GET /api/fallout/ai-insights
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/ai-insights"
    method: "GET"
    type: "llm"
    timeout_seconds: 45
    binary: "g3a"
    command: "funneling"
    defaults:
      output: "json"
      select: "coalesce(fallout_reason, order_status_desc, 'Unknown') as reason, count(1) as total"
      where: "mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)"
      group-by: "coalesce(fallout_reason, order_status_desc, 'Unknown')"
      order-by: "total desc"
      limit: "15"
    system_prompt: |
      Anda adalah AI Analis Data Operasional dan Solusi Bisnis Perusahaan.
      Tugas Anda adalah membaca ringkasan data kendala fallout order yang diberikan dan merumuskan 3 Paint Points utama serta 3 Need Support yang konkret, tajam, dan dapat ditindaklanjuti berdasarkan data riil tersebut.
      
      Format output WAJIB JSON murni sesuai skema berikut (tanpa markdown backticks):
      {
        "paint_points": [
          "Uraian permasalahan/akar kendala 1 berdasarkan data...",
          "Uraian permasalahan/akar kendala 2 berdasarkan data...",
          "Uraian permasalahan/akar kendala 3 berdasarkan data..."
        ],
        "need_support": [
          "Rekomendasi tindakan/dukungan konkret 1...",
          "Rekomendasi tindakan/dukungan konkret 2...",
          "Rekomendasi tindakan/dukungan konkret 3..."
        ]
      }

  # ----------------------------------------------------------------------------
  # 6. Fallout Branch & Category Breakdown (Pecah Kategori per Branch)
  # Endpoint: GET /api/fallout/branch-breakdown
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/branch-breakdown"
    method: "GET"
    binary: "g3a"
    command: "funneling"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: "region, branch, count(1) filter (where fallout_reason like '%WFM%' or fallout_reason like '%SISTEM%') as wfm_sistem, count(1) filter (where fallout_reason like '%UIM%' or fallout_reason like '%ACTIVATION%') as uim_activation, count(1) filter (where fallout_reason like '%API%' or fallout_reason like '%GATEWAY%') as api, count(1) filter (where fallout_reason like '%PELANGGAN%' or fallout_reason like '%RNA%') as pelanggan, count(1) filter (where fallout_reason like '%TEKNIK%' or fallout_reason like '%ODP%') as teknik, count(1) filter (where mapping_kategori in ('PENDING','FALLOUT')) as total_fallout"
      where: "mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)"
      group-by: "region, branch"
      order-by: "total_fallout desc"

  # ----------------------------------------------------------------------------
  # 7. AI Executive Regional Insight per Branch (Built-in Global LLM)
  # Endpoint: GET /api/fallout/ai-branch-insights
  # ----------------------------------------------------------------------------
  - path: "/api/fallout/ai-branch-insights"
    method: "GET"
    type: "llm"
    timeout_seconds: 45
    binary: "g3a"
    command: "funneling"
    defaults:
      output: "json"
      select: "region, branch, count(1) filter (where fallout_reason like '%WFM%' or fallout_reason like '%SISTEM%') as wfm_sistem, count(1) filter (where fallout_reason like '%UIM%' or fallout_reason like '%ACTIVATION%') as uim_activation, count(1) filter (where fallout_reason like '%API%' or fallout_reason like '%GATEWAY%') as api, count(1) filter (where fallout_reason like '%PELANGGAN%' or fallout_reason like '%RNA%') as pelanggan, count(1) filter (where fallout_reason like '%TEKNIK%' or fallout_reason like '%ODP%') as teknik, count(1) filter (where mapping_kategori in ('PENDING','FALLOUT')) as total_fallout"
      where: "mapping_kategori in ('PENDING','FALLOUT') and periode in (6,7,8)"
      group-by: "region, branch"
      order-by: "total_fallout desc"
    system_prompt: |
      Anda adalah AI Analis Data Operasional Perusahaan.
      Tugas Anda adalah membaca data rincian fallout order per branch & kategori yang disediakan di atas, lalu membuat sintesis analisis eksekutif yang akurat, proporsional, dan terstruktur per region berdasarkan angka riil tersebut.
      
      Format output WAJIB JSON murni sesuai skema berikut (tanpa markdown backticks):
      {
        "title": "Analisa Fallout per Region dan Branch",
        "regional_breakdown": [
          {
            "region": "Nama Region",
            "total": 0,
            "percentage": "0%",
            "highlight": "Karakteristik atau temuan utama di region ini",
            "branches": [
              "NAMA_BRANCH: Jumlah dan rincian kategori kendala terbesar...",
              "NAMA_BRANCH: Jumlah dan rincian kategori kendala terbesar..."
            ]
          }
        ],
        "key_takeaways": [
          "Poin kesimpulan strategis dan fokus perbaikan 1...",
          "Poin kesimpulan strategis dan fokus perbaikan 2...",
          "Poin kesimpulan strategis dan fokus perbaikan 3..."
        ]
      }

  # ============================================================================
  # ============================================================================
  # Modular Visit Analytics API Endpoints (Dihitung langsung via DuckDB Engine g3a)
  # ============================================================================

  # ----------------------------------------------------------------------------
  # 1. Visit KPI Ringkasan Kartu
  # ----------------------------------------------------------------------------
  - path: "/api/visit/kpi"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'sum(total) as total_visits, sum(case when flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'' then total else 0 end) as served_count, sum(case when flag_dilayani = 0 or flag_dilayani = ''0'' or lower(cast(flag_dilayani as varchar)) like ''%batal%'' or lower(cast(flag_dilayani as varchar)) like ''%tidak%'' then total else 0 end) as unserved_count, printf(''%.1f%%'', 100.0 * sum(case when flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'' then total else 0 end) / nullif(sum(total), 0)) as served_ratio'

  # ----------------------------------------------------------------------------
  # 1b. Ringkasan Jenis Mitra (Group By BISMOD Dinamis)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/mitra"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: '"BISMOD" as mitra, sum(total) as total'
      group-by: '"BISMOD"'
      order-by: 'total desc'

  # ----------------------------------------------------------------------------
  # 2. Visit Tren Harian (Trx Date)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/trend"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'strftime(cast("Trx Date" as date), ''%Y-%m-%d'') as "Trx Date", sum(total) as total'
      group-by: 'strftime(cast("Trx Date" as date), ''%Y-%m-%d'')'
      order-by: 'strftime(cast("Trx Date" as date), ''%Y-%m-%d'') asc'

  # ----------------------------------------------------------------------------
  # 3. Proporsi Layanan (Service)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/service"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: '"Service", sum(total) as total'
      group-by: '"Service"'
      order-by: 'total desc'
      limit: '10'

  # ----------------------------------------------------------------------------
  # 4. Kunjungan per Regional
  # ----------------------------------------------------------------------------
  - path: "/api/visit/regional"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'regional, sum(total) as total'
      group-by: 'regional'
      order-by: 'total desc'

  # ----------------------------------------------------------------------------
  # 5. Kunjungan per GraPARI (Untuk Top 10 & Bottom 10)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/grapari"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: '"Nama Grapari", regional, sum(total) as total'
      group-by: '"Nama Grapari", regional'
      order-by: 'total desc'

  # ----------------------------------------------------------------------------
  # 6. MoM (Month-over-Month) Aggregation & Comparison
  # ----------------------------------------------------------------------------
  - path: "/api/visit/mom"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'strftime(cast("Trx Date" as date), ''%Y-%m'') as periode, sum(total) as total_visits, sum(case when flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'' then total else 0 end) as served_count, sum(case when flag_dilayani = 0 or flag_dilayani = ''0'' or lower(cast(flag_dilayani as varchar)) like ''%batal%'' or lower(cast(flag_dilayani as varchar)) like ''%tidak%'' then total else 0 end) as unserved_count, printf(''%.1f%%'', 100.0 * sum(case when flag_dilayani = 1 or flag_dilayani = ''1'' or lower(cast(flag_dilayani as varchar)) like ''%dilayani%'' then total else 0 end) / nullif(sum(total), 0)) as served_ratio'
      group-by: 'strftime(cast("Trx Date" as date), ''%Y-%m'')'
      order-by: 'strftime(cast("Trx Date" as date), ''%Y-%m'') asc'
      limit: '24'

  # ============================================================================
  # Visit Performance Dashboard Endpoints
  # ============================================================================

  # ----------------------------------------------------------------------------
  # 7. Performance Total (Area Sumatera Aggregate)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/performance-total"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'sum(total) as total_visit, round(avg(epoch(average_waiting)) / 60.0, 2) as avg_waiting_minutes, round(avg(epoch(average_serving)) / 60.0, 2) as avg_serving_minutes'

  # ----------------------------------------------------------------------------
  # 8. Performance per Regional
  # ----------------------------------------------------------------------------
  - path: "/api/visit/performance-regional"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'regional, sum(total) as total_visit, round(avg(epoch(average_waiting)) / 60.0, 2) as avg_waiting_minutes, round(avg(epoch(average_serving)) / 60.0, 2) as avg_serving_minutes'
      group-by: 'regional'
      order-by: 'regional asc'

  # ----------------------------------------------------------------------------
  # 9. Performance per Territory (Top Branch)
  # ----------------------------------------------------------------------------
  - path: "/api/visit/performance-territory"
    method: "GET"
    binary: "g3a"
    command: "/home/zieru/Onedrive/antreaja/visit_parquet"
    type: "regular"
    timeout_seconds: 30
    defaults:
      output: "json"
      select: 'territory, regional, sum(total) as total_visit, round(avg(epoch(average_waiting)) / 60.0, 2) as avg_waiting_minutes, round(avg(epoch(average_serving)) / 60.0, 2) as avg_serving_minutes'
      group-by: 'territory, regional'
      order-by: 'total_visit desc'








