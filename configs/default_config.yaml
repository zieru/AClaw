server:
  data_dir: "./data"
  db_path: "./data/goassistant.db"
  md_dir: "./data/md"
  log_dir: "./data/logs"
  log_level: "info"

admin_telegram:
  bot_token: "5398115338:AAH8SvUPaVteuR_xcVf46JIEz0RaLiKPjC4" # Masukkan Token Bot Telegram Admin di sini (didapat dari @BotFather)
  allowed_user_ids: [] # Masukkan Telegram User ID Admin (contoh: [123456789]), kosongkan jika belum tahu
  poll_timeout: 30

defaults:
  default_provider: "9router"
  default_model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 2048
  max_context_turns: 20
  token_budget: 8000

# 9Router Built-in Engine Configurations
proxy_pool:
  enabled: true
  strategy: "round-robin" # round-robin, least-errors, best-latency, random
  initial_proxies: [] # Contoh: ["http://user:pass@127.0.0.1:8080", "socks5://127.0.0.1:1080"]

token_saver:
  default_mode: "auto" # auto (RTK), aggressive, caveman, off

