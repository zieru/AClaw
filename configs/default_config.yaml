server:
  data_dir: "./data"
  db_path: "./data/goassistant.db"
  md_dir: "./data/md"
  log_dir: "./data/logs"
  log_level: "info"

admin_telegram:
  bot_token: "5398115338:AAH8SvUPaVteuR_xcVf46JIEz0RaLiKPjC4" # Masukkan Token Bot Telegram Admin di sini (didapat dari @BotFather)
  allowed_user_ids: [] # Masukkan Telegram User ID Admin (contoh: [123456789]), kosongkan jika belum tahu
  poll_timeout: 30

defaults:
  default_provider: "9router"
  default_model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 2048
  max_context_turns: 20
  token_budget: 8000

# 9Router Built-in Engine Configurations
proxy_pool:
  enabled: true
  strategy: "round-robin" # round-robin, least-errors, best-latency, random
  initial_proxies: [] # Contoh: ["http://user:pass@127.0.0.1:8080", "socks5://127.0.0.1:1080"]

token_saver:
  default_mode: "auto" # auto (RTK), aggressive, caveman, off

# Streaming & Thinking Configuration
streaming:
  enabled: true              # Enable/disable streaming response secara global
  thinking_enabled: true     # Tampilkan proses berpikir/reasoning dari model AI
  thinking_display: "full"   # full (tampilkan semua), summary (ringkasan), hidden (sembunyikan)
  chunk_delay_ms: 500        # Delay (ms) antara update streaming ke Telegram (500ms = 2x/detik)

timeouts:
  api_call_seconds: 90
  handler_seconds: 120
  retry_seconds: 120

# Sub-Agent Multi-Task Delegation
subagent:
  max_parallel: 3            # Max sub-agent berjalan bersamaan (3-5 direkomendasikan)
  timeout_seconds: 90        # Batas waktu per sub-task (detik)
  auto_delegate: true        # Otomatis pecah prompt kompleks ke sub-agent
  token_budget_per_task: 2048 # Budget token per sub-agent task

# GoAssist HTTP Server Configuration
http_server:
  enabled: true              # Aktifkan HTTP server bersamaan dengan daemon
  port: 8080                 # Port HTTP Server
  endpoints_file: "configs/endpoints.yaml" # Path konfigurasi endpoint dinamis
  read_timeout_seconds: 15
  write_timeout_seconds: 45

# Auto-Updater Configuration (GitHub Releases)
updater:
  github_repo: "zieru/AClaw"  # Repository target untuk auto-update binary

# Tavily AI Web Search Plugin Configuration
tavily:
  api_key: ""                 # Masukkan API Key Tavily (tvly-...) atau set via env TAVILY_API_KEY
  search_depth: "basic"       # basic atau advanced
  max_results: 5              # Jumlah hasil pencarian maksimal
